<!DOCTYPE html>
<html lang="de"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Brüggert">
<title>Brüggert Mitarbeiter-App</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Caveat:wght@700&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
:root{--bg:#f4f4f7;--card:#fff;--tx:#1d1d22;--mut:#6e6e78;--line:#e4e4ea;--pu:#5D3D8D;--pul:#efe9f6;--red:#e5484d;--or:#f59e0b;--gr:#30a46c;--sh:0 2px 12px rgba(30,20,60,.07);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
:root[data-theme=dark]{--bg:#121216;--card:#1c1c22;--tx:#f2f2f5;--mut:#9a9aa6;--line:#2c2c34;--pul:#2e2440;--pu:#a583d9;--sh:0 2px 12px rgba(0,0,0,.4)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{font:16px -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--tx);max-width:520px;margin:0 auto}
#app{padding:0 16px 40px;min-height:100%}
.top{display:flex;align-items:center;gap:12px;padding:14px 0}
.top h1{font-size:20px;margin:0;flex:1}
.burger{width:44px;height:44px;border:0;background:var(--card);border-radius:14px;box-shadow:var(--sh);position:relative;cursor:pointer}
.burger i{position:absolute;left:12px;width:20px;height:2px;background:var(--tx);border-radius:2px;transition:.3s}
.burger i:nth-child(1){top:15px}.burger i:nth-child(2){top:21px}.burger i:nth-child(3){top:27px}
.burger.x i:nth-child(1){top:21px;transform:rotate(45deg)}.burger.x i:nth-child(2){opacity:0}.burger.x i:nth-child(3){top:21px;transform:rotate(-45deg)}
.menu{background:var(--card);border-radius:18px;box-shadow:var(--sh);overflow:hidden;margin-bottom:14px;animation:in .25s}
.menu button{display:block;width:100%;text-align:left;padding:16px 18px;border:0;border-bottom:1px solid var(--line);background:none;color:var(--tx);font-size:17px;cursor:pointer}
.menu button.acc{color:var(--red);font-weight:600;border:0}
@keyframes in{from{opacity:0;transform:translateY(-8px)}to{opacity:1;transform:none}}
.logo{font-weight:800;letter-spacing:.5px;color:var(--pu);font-size:13px;line-height:1.1}
.card{background:var(--card);border-radius:20px;box-shadow:var(--sh);padding:16px;margin-bottom:12px;border:1px solid transparent}
.card.new{border-color:var(--line)}.card.run{background:rgba(245,158,11,.12);border-color:rgba(245,158,11,.4)}.card.done{background:rgba(48,164,108,.12);border-color:rgba(48,164,108,.35)}
.btn{display:block;width:100%;padding:16px;border:0;border-radius:16px;font-size:17px;font-weight:600;color:#fff;background:var(--pu);cursor:pointer;margin-top:10px}
.btn.red{background:var(--red)}.btn.gr{background:var(--gr)}.btn.gh{background:var(--pul);color:var(--pu)}.btn:disabled{opacity:.4}
.row{display:flex;gap:10px}.row>*{flex:1}
.big{padding:30px 10px;font-size:19px}
.tag{display:inline-block;padding:3px 10px;border-radius:99px;font-size:12px;font-weight:600;color:#fff}
.hi{background:var(--red)}.mi{background:var(--or)}.lo{background:var(--gr)}
.mut{color:var(--mut);font-size:14px}.timer{font-size:34px;font-weight:700;font-variant-numeric:tabular-nums}
input[type=text],input[type=password],textarea{width:100%;padding:15px;border-radius:14px;border:1px solid var(--line);background:var(--card);color:var(--tx);font-size:16px;margin-top:10px}
.center{min-height:80vh;display:flex;flex-direction:column;justify-content:center}
.chk{display:flex;align-items:center;gap:12px;padding:13px;border:1px solid var(--line);border-radius:14px;margin-top:8px;background:var(--card)}
.chk input{width:22px;height:22px;accent-color:var(--pu)}
.bar{height:6px;background:var(--line);border-radius:6px;overflow:hidden;margin:14px 0}.bar i{display:block;height:100%;background:var(--pu);transition:.4s}
.opt{padding:18px;border:2px solid var(--line);border-radius:16px;margin-top:10px;background:var(--card);cursor:pointer;font-size:17px}.opt.sel{border-color:var(--pu);background:var(--pul)}
.toast{position:fixed;top:calc(env(safe-area-inset-top,0px) + 14px);left:50%;transform:translateX(-50%);background:var(--tx);color:var(--bg);padding:12px 20px;border-radius:99px;z-index:9;animation:in .3s}
.sig{position:fixed;inset:0;background:var(--bg);z-index:20;padding:16px;display:flex;flex-direction:column}
.sig canvas{flex:1;background:#fff;border-radius:18px;border:2px dashed var(--line);touch-action:none}
.ok{width:120px;height:120px;margin:0 auto 16px;border-radius:50%;background:var(--gr);display:flex;align-items:center;justify-content:center;animation:pop .6s}
.ok svg{width:64px;stroke:#fff;stroke-width:6;fill:none;stroke-dasharray:60;stroke-dashoffset:60;animation:dr .6s .3s forwards}
@keyframes pop{from{transform:scale(0)}to{transform:scale(1)}}@keyframes dr{to{stroke-dashoffset:0}}
.msg{padding:10px 14px;border-radius:16px;margin:6px 0;max-width:80%;background:var(--card)}.msg.me{background:var(--pu);color:#fff;margin-left:auto}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--red);margin-left:6px}
.back{background:none;border:0;color:var(--pu);font-size:16px;padding:0 0 8px;cursor:pointer}
.note{font-size:12px;color:var(--mut);text-align:center;margin-top:20px}
.card{border-radius:24px}.menu{border-radius:24px}.btn{border-radius:18px;box-shadow:0 6px 16px rgba(93,61,141,.28)}.btn.red{box-shadow:0 6px 16px rgba(229,72,77,.3)}.btn.gr{box-shadow:0 6px 16px rgba(48,164,108,.3)}.btn.gh{box-shadow:none}
.sw{display:flex;align-items:center;justify-content:space-between;padding:14px 4px;font-size:17px}
.sw input{appearance:none;-webkit-appearance:none;width:52px;height:32px;border-radius:99px;background:var(--line);position:relative;transition:.25s;border:0;margin:0}
.sw input::after{content:"";position:absolute;top:3px;left:3px;width:26px;height:26px;border-radius:50%;background:#fff;box-shadow:0 1px 4px rgba(0,0,0,.3);transition:.25s}
.sw input:checked{background:var(--pu)}.sw input:checked::after{left:23px}
.hm{width:44px;height:44px;border:0;background:var(--card);border-radius:14px;box-shadow:var(--sh);color:var(--pu);cursor:pointer;display:flex;align-items:center;justify-content:center}
.bd{position:fixed;inset:0;background:rgba(0,0,0,.45);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);z-index:20;display:flex;align-items:flex-end;animation:fd .25s}
.sh{width:100%;max-width:520px;margin:0 auto;background:var(--card);border-radius:28px 28px 0 0;padding:12px 16px calc(16px + env(safe-area-inset-bottom,0px));animation:up .3s}
.grip{width:40px;height:5px;border-radius:5px;background:var(--line);margin:0 auto 14px}
@keyframes fd{from{opacity:0}}@keyframes up{from{transform:translateY(100%)}}
input[type=number]{width:100%;padding:15px;border-radius:14px;border:1px solid var(--line);background:var(--card);color:var(--tx);font-size:16px;margin-top:10px}

function head(title,home){return `<div class="top">${home?"":`<button class="hm" onclick="go('home')" aria-label="Start"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l9-8 9 8"/><path d="M5 10v10h5v-6h4v6h5V10"/></svg></button>`}<div style="flex:1">${home?`<div class="logo">BÜRO AUSSTATTUNG<br>BRÜGGERT GmbH</div>`:`<h1>${title}</h1>`}</div><button class="burger ${menu?"x":""}" onclick="menu=!menu;R()" aria-label="Menü"><i></i><i></i><i></i></button></div>${menu?`<div class="menu"><button onclick="go('jobs')">${t("jobs")}</button><button onclick="go('msgs')">${t("msgs")}${unread()?'<span class="dot"></span>':""}</button><button onclick="go('set')">${t("set")}</button><button class="acc" onclick="go('acc')">${t("acc")}</button></div>`:""}`}
function go(v,id){view=v;menu=false;if(id)cur=id;if(v=="msgs")S.msgs.forEach(m=>m.read=true),save();R();scrollTo(0,0)}
function card(j){const c=j.st=="run"?"run":j.st=="done"?"done":"new";return `<div class="card ${c}" onclick="go('job',${j.id})"><div style="display:flex;justify-content:space-between"><b>${j.cust}</b><span class="tag ${j.pr}">${t("pr")[j.pr]}</span></div><div class="mut">Kd.-Nr. <b>${j.no}</b> · ${t("st")[j.st]}</div><p style="margin:8px 0">${j.desc}</p><div class="mut">📍 ${j.adr}</div></div>`}
function actBox(){if(!S.active)return"";const j=job(S.active.id);return `<div class="card run"><div class="mut">${t("active")}</div><b>${j.cust}</b><div class="timer" data-t>${fmt(Date.now()-S.active.start)}</div><span class="tag mi">${t("st").run}</span><div class="row"><button class="btn gh" onclick="go('job',${j.id})">${t("goto")}</button><button class="btn red" onclick="openEnd(${j.id})">${t("end")}</button></div></div>`}
function R(){
  const a=$("#app");let h="";
  if(view=="login")h=`<div class="center"><div class="logo" style="font-size:18px;text-align:center;margin-bottom:28px">BÜRO AUSSTATTUNG<br>BRÜGGERT GmbH</div><input id="u" type="text" placeholder="${t("user")}" autocapitalize="off"><label class="sw">${t("rem")}<input id="r" type="checkbox" checked></label><button class="btn" onclick="login()">${t("login")}</button></div>`;
  else if(view=="setup"){const L=[["de","Deutsch"],["en","English"]],A=[["light",t("light")],["dark",t("dark")]],N=[[true,t("allow")],[false,t("off")]];
    const o=step==0?L.map(([k,n])=>`<div class="opt ${S.lang==k?"sel":""}" onclick="S.lang='${k}';R()">${n}</div>`).join(""):step==1?A.map(([k,n])=>`<div class="opt ${S.theme==k?"sel":""}" onclick="S.theme='${k}';theme();R()">${n}</div>`).join(""):`<p class="mut">${t("ntx")}</p>`+N.map(([k,n])=>`<div class="opt ${S.notif===k?"sel":""}" onclick="setNotif(${k})">${n}</div>`).join("");
    h=`<div class="center"><div class="mut">${t("setup")} ${step}/3</div><div class="bar"><i style="width:${step/3*100}%"></i></div><h1>${[t("lang"),t("look"),t("notif")][step]}</h1>${o}<button class="btn" onclick="nextStep()">${step==2?t("fin"):t("next")}</button></div>`}
  else if(view=="home")h=head("",1)+routeCard()+actBox()+`<div class="row"><button class="btn big" onclick="go('jobs')">📋<br>${t("jobs")}</button><button class="btn big gh" onclick="go('arch')">🗂<br>${t("arch")}</button></div><div class="note">${t("loc")}</div>`;
  else if(view=="jobs")h=head(t("jobs"))+routeCard()+S.jobs.filter(j=>j.st!="done").map(card).join("")+routeBtn();
  else if(view=="job"){const j=job(cur),q=encodeURIComponent(j.adr);h=head(j.cust)+`<button class="back" onclick="go('jobs')">${t("back")}</button>`+card(j).replace(/onclick="[^"]*"/,"")+`<div class="card">✉️ ${j.mail}<br><a href="tel:${TEL[j.id]}" style="color:var(--pu);text-decoration:none;font-weight:600">📞 ${TEL[j.id]}</a></div><button class="btn gh" onclick="navSheet('${q}')">🧭 ${t("nav")}</button>`+(j.st=="new"?`<button class="btn red" ${S.routeStart&&!S.routeEnded?"":"disabled"} onclick="startJob(${j.id})">${t("start")}</button>${S.routeStart&&!S.routeEnded?"":`<div class="note">${S.lang=="de"?"Zuerst auf der Startseite „Route starten“ tippen.":"Tap “Start route” on the home screen first."}</div>`}`:j.st=="run"?`<div class="timer" data-t style="text-align:center;margin-top:14px">${fmt(Date.now()-S.active.start)}</div><button class="btn red" onclick="openEnd(${j.id})">${t("end")}</button>`:"")}
  else if(view=="arch")h=head(t("arch"))+(S.archive.length?S.archive.map(e=>`<div class="card done"><b>${e.cust}</b><div class="mut">${new Date(e.end).toLocaleString(S.lang)} · ${fmt(e.end-e.start)}</div><div class="row"><button class="btn gh" onclick="pdf(${e.id})">${t("pdf")}</button><button class="btn" onclick="mailPdf(${e.id})">${t("mail")}</button></div></div>`).join(""):`<p class="mut">${t("empty")}</p>`);
  else if(view=="msgs")h=head(t("msgs"))+S.msgs.map(m=>`<div class="msg ${m.from=="me"?"me":""}">${m.t}<div class="mut" style="font-size:11px;${m.from=="me"?"color:#eee":""}">${new Date(m.ts).toLocaleTimeString(S.lang,{hour:"2-digit",minute:"2-digit"})}</div></div>`).join("")+`<input id="mi" type="text" placeholder="${t("wr")}"><button class="btn" onclick="sendMsg()">${t("send")}</button>`;
  else if(view=="set"){h=head(t("set"))+`<div class="card"><b>${t("lang")}</b><div class="row"><button class="btn ${S.lang=="de"?"":"gh"}" onclick="S.lang='de';save();R()">Deutsch</button><button class="btn ${S.lang=="en"?"":"gh"}" onclick="S.lang='en';save();R()">English</button></div></div><div class="card"><b>${t("look")}</b><div class="row">${["light","dark"].map(k=>`<button class="btn ${S.theme==k?"":"gh"}" style="padding:12px 4px;font-size:14px" onclick="S.theme='${k}';theme();save();R()">${t(k)}</button>`).join("")}</div></div><div class="card"><b>${t("notif")}</b><div class="row"><button class="btn ${S.notif?"":"gh"}" onclick="setNotif(true,1)">${t("allow")}</button><button class="btn ${!S.notif?"":"gh"}" onclick="setNotif(false,1)">${t("off")}</button></div></div>`}
  else if(view=="acc")h=head(t("acc"))+`<button class="btn red big" onclick="logout()">${t("out")}</button>`;
  a.innerHTML=h;
}
function login(){const u=$("#u").value.trim();
  if(!u)return toast(t("bad"));
  const name=u;if($("#r").checked){S.sess={user:name,token:crypto.getRandomValues(new Uint32Array(4)).join("-")}}
  begin(name)}
function begin(name){const firstTime=S.first;S.user=name;save();toast((firstTime?t("w1"):t("w2"))+name+"!");S.first=false;save();view=S.setup?"home":"setup";step=0;R()}
async function setNotif(v,s){S.notif=v;if(v&&"Notification"in window){try{await Notification.requestPermission()}catch(e){}}save();R()}
function nextStep(){if(step<2){step++;R()}else{S.setup=true;save();document.body.insertAdjacentHTML("beforeend",`<div class="sig" id="fx" style="align-items:center;justify-content:center"><div class="ok"><svg viewBox="0 0 64 64"><path d="M14 34l12 12 24-26"/></svg></div></div>`);setTimeout(()=>{$("#fx").remove();view="home";R()},1100)}}
function logout(){S.sess=null;S.user=null;save();view="login";menu=false;R()}
function startJob(id){if(!S.routeStart||S.routeEnded)return toast(S.lang=="de"?"Bitte zuerst „Route starten“":"Please start the route first");if(S.active)return toast(t("one"));const j=job(id);j.st="run";S.active={id,start:Date.now()};save();go("home")}
function navSheet(q){const d=document.createElement("div");d.className="bd";d.onclick=e=>{if(e.target==d)d.remove()};d.innerHTML=`<div class="sh"><div class="grip"></div><a style="text-decoration:none" href="https://maps.apple.com/?daddr=${q}"><div class="btn">Apple Karten</div></a><a style="text-decoration:none" href="https://www.google.com/maps/dir/?api=1&destination=${q}"><div class="btn gh">Google Maps</div></a><a style="text-decoration:none" href="https://waze.com/ul?q=${q}&navigate=yes"><div class="btn gh">Waze</div></a><button class="btn gh" onclick="this.closest('.bd').remove()">${t("cancel")}</button></div>`;document.body.appendChild(d)}
function openEnd(id){cur=id;tmp={w:[],x:""};sigData=null;const d=document.createElement("div");d.className="sig";d.id="end";d.style.overflow="auto";d.style.display="block";d.innerHTML=`<h2>${t("end")}</h2><b>${t("works")}</b>${t("wl").map((w,i)=>`<label class="chk"><input type="checkbox" onchange="tmp.w[${i}]=this.checked;chk()"> ${w}</label>`).join("")}<p><b>${t("extra")}</b></p><textarea rows="3" oninput="tmp.x=this.value"></textarea><p><b>${S.lang=="de"?"Zählerstand Drucker (optional)":"Printer meter (optional)"}</b></p><div class="row"><input type="number" inputmode="numeric" min="0" placeholder="${S.lang=="de"?"Seiten Schwarz-Weiß":"B/W pages"}" oninput="tmp.bw=this.value"><input type="number" inputmode="numeric" min="0" placeholder="${S.lang=="de"?"Seiten Farbe":"Colour pages"}" oninput="tmp.col=this.value"></div><p><b>${t("sign")}</b></p><div class="card" id="sp" onclick="openSig()" style="min-height:90px;text-align:center">✍️ ${t("signb")}</div><button class="btn gr" id="dn" disabled onclick="finish()">${t("doneb")}</button><button class="btn gh" onclick="$('#end').remove()">${t("cancel")}</button>`;document.body.appendChild(d)}
function chk(){$("#dn").disabled=!(tmp.w.some(Boolean)&&sigData)}
let ROT=90;
function openSig(keep){const old=keep&&$("#cv")?$("#cv").toDataURL():null;if($("#sg"))$("#sg").remove();
const land=innerWidth>innerHeight,rot=land?0:ROT,d=document.createElement("div");d.className="sig";d.id="sg";
if(rot)d.style.cssText=`inset:auto;top:0;left:0;width:${innerHeight}px;height:${innerWidth}px;transform-origin:0 0;transform:${rot==90?`translateX(${innerWidth}px) rotate(90deg)`:`translateY(${innerHeight}px) rotate(-90deg)`}`;
d.innerHTML=`<div class="mut" style="text-align:center;margin-bottom:6px">${S.lang=="de"?"Bitte Handy quer halten und unterschreiben":"Please hold the phone sideways and sign"}</div><canvas id="cv" style="min-height:0;width:100%;flex:1 1 0"></canvas><div class="row"><button class="btn gh" onclick="clr()">${t("clr")}</button><button class="btn gh" onclick="ROT=-ROT;openSig()">↻</button><button class="btn gh" onclick="$('#sg').remove()">${t("cancel")}</button><button class="btn" onclick="takeSig()">${t("take")}</button></div>`;
document.body.appendChild(d);const c=$("#cv"),r=c.getBoundingClientRect(),lw=rot?r.height:r.width,lh=rot?r.width:r.height;c.width=lw*2;c.height=lh*2;const x=c.getContext("2d");
if(old){const im=new Image();im.onload=()=>{x.save();x.setTransform(1,0,0,1,0,0);x.drawImage(im,0,0,c.width,c.height);x.restore()};im.src=old}
x.scale(2,2);x.lineWidth=2.5;x.lineCap="round";x.strokeStyle="#111";let dr=false;
const p=e=>{const b=c.getBoundingClientRect();return rot==90?[e.clientY-b.top,b.right-e.clientX]:rot==-90?[b.bottom-e.clientY,e.clientX-b.left]:[e.clientX-b.left,e.clientY-b.top]};
c.onpointerdown=e=>{dr=true;x.beginPath();x.moveTo(...p(e));c.setPointerCapture(e.pointerId)};c.onpointermove=e=>{if(dr){x.lineTo(...p(e));x.stroke()}};c.onpointerup=()=>dr=false}
addEventListener("resize",()=>{if($("#sg"))openSig(1)});
function clr(){const c=$("#cv");c.getContext("2d").clearRect(0,0,c.width,c.height)}
function takeSig(){const c=$("#cv"),b=document.createElement("canvas");b.width=c.width;b.height=c.height;const x=b.getContext("2d");x.fillStyle="#fff";x.fillRect(0,0,b.width,b.height);x.drawImage(c,0,0);sigData=b.toDataURL("image/png");$("#sg").remove();$("#sp").innerHTML=`<img src="${sigData}" style="max-width:100%;max-height:120px">`;chk()}
function finish(){const j=job(cur),e={id:j.id,cust:j.cust,no:j.no,adr:j.adr,mail:j.mail,desc:j.desc,start:S.active.start,end:Date.now(),works:t("wl").filter((w,i)=>tmp.w[i]),x:tmp.x,bw:tmp.bw||"",col:tmp.col||"",sig:sigData};j.st="done";S.archive.unshift(e);S.active=null;save();$("#end").remove();last=e;
  const d=document.createElement("div");d.className="sig";d.id="okv";d.style.justifyContent="center";d.innerHTML=`<div style="text-align:center"><div class="ok"><svg viewBox="0 0 64 64"><path d="M14 34l12 12 24-26"/></svg></div><h1>${t("ok")}</h1><button class="btn" onclick="pdf(${e.id})">${t("pdf")}</button><button class="btn gh" onclick="mailPdf(${e.id})">${t("mail")}</button><button class="btn gh" onclick="$('#okv').remove();go('home')">OK</button></div>`;document.body.appendChild(d)}
function pdf(id){const e=S.archive.find(a=>a.id==id)||last;if(!window.jspdf)return toast("PDF-Bibliothek nicht geladen");const d=new window.jspdf.jsPDF(),L=(s,y,sz=11,b=0)=>{d.setFontSize(sz);d.setFont("helvetica",b?"bold":"normal");d.text(String(s),20,y)};
  d.setFillColor(93,61,141);d.rect(0,0,210,28,"F");d.setTextColor(255);L("BÜRO AUSSTATTUNG BRÜGGERT GmbH",17,15,1);d.setTextColor(30);
  L("Abschlussbericht / Service report",45,16,1);let y=60;[["Kunde",e.cust],["Kundennr.",e.no],["Adresse",e.adr],["Beginn",new Date(e.start).toLocaleString("de")],["Ende",new Date(e.end).toLocaleString("de")],["Dauer",fmt(e.end-e.start)],["Problem",e.desc],["Arbeiten",e.works.join(", ")],["Info",e.x||"-"]].forEach(([k,v])=>{L(k+":",y,11,1);d.text(String(v),55,y,{maxWidth:130});y+=k=="Problem"||k=="Info"?16:10});
  L("Unterschrift Kunde:",y+6,11,1);if(e.sig)d.addImage(e.sig,"PNG",20,y+10,70,35);d.save("Bericht-"+e.no+".pdf")}
function mailPdf(){const e=last;location.href=`mailto:${e.mail}?subject=${encodeURIComponent("Abschlussbericht "+e.no)}&body=${encodeURIComponent("Bitte den heruntergeladenen PDF-Bericht anhängen.")}`}
function sendMsg(){const v=$("#mi").value.trim();if(!v)return;S.msgs.push({from:"me",t:v,ts:Date.now(),read:true});save();R();setTimeout(()=>{S.msgs.push({from:"disp",t:"Danke, verstanden. (Demo-Antwort)",ts:Date.now(),read:view=="msgs"});save();if(view=="msgs")R();if(S.notif&&"Notification"in window&&Notification.permission=="granted")new Notification("Dispatcher","Neue Nachricht")},1500)}
const TPL='Guten Tag,\n\nanbei erhalten Sie den Abschlussbericht zu Ihrem Auftrag {nr} ({kunde}).\n\nMit freundlichen Grüßen\nBÜRO AUSSTATTUNG BRÜGGERT GmbH';
function routeBtn(){const de=S.lang=="de",all=S.jobs.every(j=>j.st=="done");if(!S.routeStart)return"";
  if(S.routeEnded)return `<p class="mut" style="text-align:center">${de?"Route beendet ✔":"Route ended ✔"}</p>`;
  return `<button class="btn gr" ${all?"":"disabled"} onclick="endRoute()">${de?"Route beenden":"End route"}</button>`+(all?"":`<div class="note">${de?"Verfügbar, sobald alle Aufträge erledigt sind.":"Available once all jobs are done."}</div>`)}
function endRoute(){S.routeEnded=true;S.routeEnd=Date.now();save();toast(S.lang=="de"?"Route beendet":"Route ended");go("home")}
function mk(e){const d=new window.jspdf.jsPDF(),P=18,tm=x=>new Date(x).toLocaleTimeString('de',{hour:'2-digit',minute:'2-digit'});let y=46;
const F=(b,s)=>{d.setFont('helvetica',b?'bold':'normal');d.setFontSize(s)};
const H=t=>{d.setFillColor(239,233,246);d.roundedRect(P,y-5,174,8,2,2,'F');d.setTextColor(93,61,141);F(1,10);d.text(t,P+3,y+.8);y+=11;d.setTextColor(30);F(0,10)};
const K=(k,v)=>{d.setTextColor(110);d.text(k,P+3,y);d.setTextColor(30);const l=d.splitTextToSize(String(v||'-'),120);d.text(l,P+42,y);y+=l.length*5+2};
d.setFillColor(93,61,141);d.rect(0,0,210,34,'F');d.setTextColor(255);F(1,16);d.text('BÜRO AUSSTATTUNG BRÜGGERT GmbH',P,15);F(0,10);d.text('Service-Abschlussbericht',P,24);d.text('Nr. '+e.no+'-'+e.id,192,24,{align:'right'});
H('KUNDENDATEN');K('Kunde',e.cust);K('Kundennr.',e.no);K('Telefon',TEL[e.id]);K('Adresse',e.adr);K('E-Mail',e.mail);y+=3;
H('EINSATZZEITEN');K('Datum',new Date(e.start).toLocaleDateString('de'));K('Beginn',tm(e.start));K('Ende',tm(e.end));K('Dauer',fmt(e.end-e.start));y+=3;
H('AUFTRAG');K('Problem',e.desc);y+=3;
H('DURCHGEFÜHRTE ARBEITEN');e.works.forEach(w=>{d.text('- '+w,P+3,y);y+=6});y+=3;
H('ZUSÄTZLICHE INFORMATIONEN');const l=d.splitTextToSize(e.x||'-',165);d.text(l,P+3,y);y+=l.length*5+5;
if(e.bw||e.col){H('ZÄHLERSTAND DRUCKER');K('Schwarz-Weiß',e.bw?e.bw+' Seiten':'-');K('Farbe',e.col?e.col+' Seiten':'-');y+=3}if(y>205){d.addPage();y=24}H('UNTERSCHRIFT DES KUNDEN');let sh=28;if(e.sig){const pr=d.getImageProperties(e.sig);sh=Math.min(40,70*pr.height/pr.width);d.addImage(e.sig,'PNG',P+3,y,70,sh)}y+=sh+4;d.setDrawColor(180);d.line(P+3,y,P+85,y);d.setTextColor(110);F(0,8);d.text('Unterschrift Kunde, '+new Date(e.end).toLocaleDateString('de'),P+3,y+4);
d.text('Erstellt mit der Brüggert Mitarbeiter-App',P,288);return d}
function pdf(id){const e=S.archive.find(a=>a.id==id)||last;if(!window.jspdf)return toast('PDF-Bibliothek nicht geladen');mk(e).save('Bericht-'+e.no+'.pdf')}
/* Versand: Backend später hier eintragen (Absender-E-Mail, Server-URL). Ohne Backend: Demo über die E-Mail-App. */
const MAIL={endpoint:"",from:""};
async function mailPdf(id){const e=S.archive.find(a=>a.id==id)||last;if(!window.jspdf)return toast('PDF-Bibliothek nicht geladen');
const doc=mk(e),name='Bericht-'+e.no+'.pdf',to=e.mail,subj='Abschlussbericht '+e.no,txt=TPL.replace('{nr}',e.no).replace('{kunde}',e.cust);
if(MAIL.endpoint){try{const b64=doc.output('datauristring').split(',')[1];const r=await fetch(MAIL.endpoint,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({from:MAIL.from,to,subject:subj,text:txt,filename:name,pdfBase64:b64})});toast(r.ok?'Gesendet an '+to:'Senden fehlgeschlagen')}catch(x){toast('Senden fehlgeschlagen')}return}
doc.save(name);toast('Demo: E-Mail an '+to+' wird vorbereitet');
setTimeout(()=>{location.href='mailto:'+to+'?subject='+encodeURIComponent(subj)+'&body='+encodeURIComponent(txt)},900)}
const MAIL_CONFIG={endpoint:'',from:''}; // SPÄTER: Backend-URL und Absender-E-Mail eintragen
async function mailPdf(id){const e=S.archive.find(a=>a.id==id)||last,de=S.lang=='de';if(!window.jspdf)return toast('PDF-Bibliothek nicht geladen');
const doc=mk(e),name='Bericht-'+e.no+'.pdf',txt=TPL.replace('{nr}',e.no).replace('{kunde}',e.cust);
if(MAIL_CONFIG.endpoint){try{const r=await fetch(MAIL_CONFIG.endpoint,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({from:MAIL_CONFIG.from,to:e.mail,subject:'Abschlussbericht '+e.no,text:txt,filename:name,pdfBase64:doc.output('datauristring').split(',')[1]})});if(!r.ok)throw 0;return toast(de?'E-Mail gesendet an '+e.mail:'Email sent to '+e.mail)}catch(x){return toast(de?'Versand fehlgeschlagen':'Sending failed')}}
toast(de?'Direktversand noch nicht eingerichtet – Mail-Dialog wird geöffnet':'Direct sending not set up yet');
try{const f=new File([doc.output('blob')],name,{type:'application/pdf'});if(navigator.canShare&&navigator.canShare({files:[f]})){await navigator.share({files:[f],title:'Abschlussbericht '+e.no,text:txt});return}}catch(x){}
doc.save(name);location.href='mailto:'+e.mail+'?subject='+encodeURIComponent('Abschlussbericht '+e.no)+'&body='+encodeURIComponent(txt)}
function endSplash(){const s=$('#splash');if(!s)return;s.style.opacity=0;setTimeout(()=>s.remove(),600)}
function routeCard(){const de=S.lang=="de",f=x=>new Date(x).toLocaleTimeString(S.lang,{hour:"2-digit",minute:"2-digit"});
if(S.routeEnded)return `<div class="card done">✔ ${de?"Route beendet":"Route ended"} · ${f(S.routeStart)}–${f(S.routeEnd)}</div>`;
if(S.routeStart)return `<div class="card run"><b>${de?"Eingestempelt":"Clocked in"}</b><div class="mut">${de?"Route läuft seit":"Route running since"} ${f(S.routeStart)}</div></div>`;
return `<div class="card"><b>${de?"Route noch nicht gestartet":"Route not started"}</b><div class="mut">${de?"Starte die Route zum Einstempeln. Erst danach können Aufträge gestartet werden.":"Start your route to clock in. Jobs can only be started afterwards."}</div><button class="btn red" onclick="startRoute()">${de?"Route starten":"Start route"}</button></div>`}
function startRoute(){S.routeStart=Date.now();S.routeEnded=false;S.routeEnd=null;save();toast(S.lang=="de"?"Eingestempelt – gute Fahrt!":"Clocked in");R()}
tick=setInterval(()=>{if(S.active)document.querySelectorAll("[data-t]").forEach(e=>e.textContent=fmt(Date.now()-S.active.start))},1000);
theme();setTimeout(endSplash,5200);if(S.sess&&S.user){setTimeout(()=>begin(S.user),5000)}else R();
</script></body></html>
